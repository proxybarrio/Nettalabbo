name: Nettalabbo verification
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb iputils-ping traceroute openssh-client telnet bind9-dnsutils
      - name: Compile all Python modules
        run: python3 -m compileall -q .
      - name: Run offline unit and integration tests
        run: xvfb-run -a python3 -m unittest discover -v
      - name: Public DNS smoke check (non-gating, no blacklist or SMTP requests)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          from diagnose import diagnose
          report = diagnose('example.com', check_blacklists=False, check_smtp=False)
          print(report.as_text())
          assert any(x.name in ('A records', 'AAAA records') and x.status == 'pass'
                     for x in report.checks), 'Public DNS did not return an address'
          assert any(x.name == 'DNSBL' and x.status == 'skipped'
                     for x in report.checks)
          assert any(x.name == 'SMTP connectivity' and x.status == 'skipped'
                     for x in report.checks)
          PY
      - name: Build Debian package
        run: bash packaging/build_deb.sh "$RUNNER_TEMP"
      - name: Verify Debian package contents
        run: |
          version="$(sed -n 's/^Version: //p' packaging/control | head -n 1)"
          deb="$RUNNER_TEMP/nettalabbo_${version}_all.deb"
          test -s "$deb"
          dpkg-deb --contents "$deb" > "$RUNNER_TEMP/package_contents.txt"
          grep -q '/usr/share/nettalabbo/mail_policy.py' "$RUNNER_TEMP/package_contents.txt"
          grep -q '/usr/share/nettalabbo/diagnose.py' "$RUNNER_TEMP/package_contents.txt"
          grep -q '/usr/share/nettalabbo/terminal_colours.py' "$RUNNER_TEMP/package_contents.txt"
          grep -q '/usr/share/nettalabbo/legacy_theme.py' "$RUNNER_TEMP/package_contents.txt"
          if grep -E 'REVIEW|PRECHECK|BLOCKERS' "$RUNNER_TEMP/package_contents.txt"; then
            echo "Internal review documents must not be packaged" >&2
            exit 1
          fi

  focal-python38:
    # Oldest supported release: Ubuntu 20.04 with its own Python 3.8 and Tk,
    # tests plus a real APT installation of the built package.
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Ubuntu 20.04 packages
        run: |
          apt-get update
          apt-get install -y python3 python3-tk xvfb xauth iputils-ping traceroute openssh-client telnet dnsutils ca-certificates
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Show Python and Tk versions
        run: python3 -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"
      - name: Run all tests on Python 3.8
        run: xvfb-run -a python3 -m unittest discover -v
      - name: Build the Debian package
        run: bash packaging/build_deb.sh /tmp/deb
      - name: Install the package with APT and start it
        run: |
          apt-get install -y /tmp/deb/nettalabbo_*_all.deb
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' nettalabbo
          xvfb-run -a python3 -c "import sys, tkinter; sys.path.insert(0, '/usr/share/nettalabbo'); import nettalabbo; root = tkinter.Tk(); app = nettalabbo.App(root); [app.select_page(p) or root.update() for p in nettalabbo.TABS]; print('Started', nettalabbo.PACKAGE_VERSION, 'with', len(nettalabbo.TABS), 'pages'); root.destroy()"

  publish-deb:
    # Keeps the Debian package available on GitHub:
    # - every push to main: the built .deb and SHA256SUMS as a workflow artifact;
    # - every new version in packaging/control: a GitHub Release v<version>
    #   with the same two files, which the in-app updater reads.
    # Runs only after both test jobs have passed.
    needs: [tests, focal-python38]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Build package and checksums
        run: bash packaging/make_release.sh dist
      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nettalabbo-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish a GitHub Release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^Version: //p' packaging/control | head -n 1)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published files are never replaced."
            echo "Increase Version in packaging/control (and PACKAGE_VERSION) to publish a new one."
            exit 0
          fi
          python3 - "$VERSION" > release-notes.md <<'PY'
          import re, sys
          upstream, _, revision = sys.argv[1].partition('-')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          heading = re.compile(r'^## ' + re.escape(upstream) + r' Debian revision ' + re.escape(revision) + r'\b.*$', re.M)
          match = heading.search(text)
          if match:
              rest = text[match.end():]
              end = re.search(r'^## ', rest, re.M)
              print(rest[:end.start()].strip() if end else rest.strip())
          else:
              print('See CHANGELOG.md for the changes in this version.')
          print()
          print('Install: `sudo apt install ./nettalabbo_' + sys.argv[1] + '_all.deb`. '
                'Check the download with `sha256sum -c SHA256SUMS`.')
          PY
          gh release create "$TAG" dist/nettalabbo_"$VERSION"_all.deb dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Nettalabbo $VERSION" --notes-file release-notes.md
